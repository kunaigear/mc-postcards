name: release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: dev
    permissions:
      code: read
      releases: write
    steps:
      - uses: actions/checkout@v4

      - name: Read Java version from Gradle
        run: echo "JAVA_VERSION=$(grep '^java_version' gradle.properties | cut -d'=' -f2)" >> "$GITHUB_ENV"

      # The dev image has no JDK. Loom also needs Gradle itself to run on this version.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # A tag that disagrees with mod_version would publish a jar under the wrong name.
      - name: Check tag matches mod version
        run: |
          mod_version="$(grep '^mod_version' gradle.properties | cut -d'=' -f2)"
          if [ "$GITHUB_REF_NAME" != "v$mod_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $mod_version" >&2
            exit 1
          fi

      - name: Build Fabric mod
        run: chmod +x ./gradlew && ./gradlew build --no-daemon

      - name: Collect release files
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-devtest-*' -exec cp {} release/ \;
          (cd release && sha256sum *.jar > SHA256_CHECKSUM.txt)
          cat release/SHA256_CHECKSUM.txt

      - name: Publish Gitea release
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          set -eu
          release_file="$RUNNER_TEMP/release.json"
          release_url="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME"
          auth_header="Authorization: token $GITEA_TOKEN"
          status="$(curl --silent --show-error --output "$release_file" --write-out '%{http_code}' \
            --header "$auth_header" "$release_url" || true)"

          if [ "$status" = 404 ]; then
            # CHANGELOG.md is the release body.
            python3 -c 'import json, os, sys; print(json.dumps({"tag_name": os.environ["GITHUB_REF_NAME"], "name": os.environ["GITHUB_REF_NAME"], "body": sys.stdin.read()}))' \
              < CHANGELOG.md > "$RUNNER_TEMP/release-request.json"
            curl --fail --silent --show-error --request POST \
              --header "$auth_header" \
              --header 'Content-Type: application/json' \
              --data "@$RUNNER_TEMP/release-request.json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases" > "$release_file"
          elif [ "$status" != 200 ]; then
            cat "$release_file"
            exit 1
          fi

          release_id="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])' < "$release_file")"
          for file in release/*; do
            filename="${file##*/}"
            # The jar name contains '+' (1.0.0+26.3), which a query string would turn into a space.
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$filename")"
            curl --fail --silent --show-error --request POST \
              --header "$auth_header" \
              --form "attachment=@$file" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$encoded"
          done
